<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //Flatten a Nested Array
        let nestedArr = [1, [2, [3, [4, 5]]], 6];
        //1 solution
        //nestedArr.flat(Infinity); //[1, 2, 3, 4, 5, 6]

        //2nd solution
        function flatNestedArr(arr){
            return arr.reduce((acc, flattenArray) => {
                //acc//[]
                /* console.log(flattenArray) */
                return acc.concat(Array.isArray(flattenArray) ? flatNestedArr(flattenArray) : flattenArray)
            }, [])
        }

        console.log(flatNestedArr(nestedArr))

        //3rd solution
        function flattenArray(nestedArr){
            let arr = [];
            nestedArr.forEach(element => {
                if(Array.isArray(element)){
                    //The spread operator (...) is used to expand an array into its individual elements.
                    arr.push(...flattenArray(element))
                } else {
                    arr.push(element)
                }
            });
            return arr
        }

        console.log(flattenArray(nestedArr))
    </script>
</body>
</html>
