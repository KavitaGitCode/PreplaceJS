    <script>
        //rotate the array
        let nums = [1, 2, 3, 4, 5, 6, 7];
        let target = 3;

        /*   console.log(nums[nums.length - 3]); */
        let startSlice = nums[nums.length - target];
        let rotateArr = nums.slice(startSlice - 1);
        nums.length = nums.length - target;
        nums.splice(0, 0, ...rotateArr);
        console.log(nums);

        function rotate(nums, k) {
            // Normalize k to ensure it's within bounds
            k = k % nums.length; //// Normalize k to avoid unnecessary full rotations
            console.log(k, nums.length, k % nums.length)

            // If k is 0, the array doesn't need to be rotated
            if (k === 0) return nums;

            // Split and concatenate the array
            let rotateArr = nums.slice(-k); // Get the last k elements
            /*  console.log(rotateArr) */
            let remainingArr = nums.slice(0, nums.length - k); // Get the first part of the array
            /*  console.log(remainingArr) */

            return rotateArr.concat(remainingArr);
        }

        console.log(rotate([1], 0)) //[1]
        console.log(rotate([1, 2, 3, 4, 5, 6, 7], target)) //[5,6,7,1,2,3,4]

        let prices = [7, 1, 5, 3, 6, 4];
        //let prices = [7,6,4,3,1];
        //INTERVIEW best time to buy and sell stock
        //let prices = [1,2];
        function buyStock(prices) {
            let getLastItem = prices[prices.length - 1];
            let buyPrice = Math.min(...prices);
            if (buyPrice < getLastItem) {
                let sellPrice = prices.sort((a, b) => b - a);
                let profit = sellPrice[1] - buyPrice;
                return profit;
            }
            return 0;
        }

        //console.log(buyStock(prices)) //5

        //another solution
        function buyStockSellStock(prices) {
            let minPrice = Infinity; // Initialize minPrice to a very high value
            let maxProfit = 0; // Initialize maxProfit to 0
           // console.log(minPrice)
            for (let price of prices) {
                if (price < minPrice) {
                    minPrice = price; // Update minPrice if the current price is lower
                    console.log(minPrice , 'minPrice')
                } else {
                    // Calculate profit if current price is higher than minPrice
                    console.log(price, minPrice, price - minPrice , "me")
                    let profit = price - minPrice;
                    if (profit > maxProfit) {
                        maxProfit = profit; // Update maxProfit if the current profit is higher
                    }
                }
            }

            return maxProfit;
        }

        console.log(buyStockSellStock(prices));

        ///interview two sum and target
        let newArr = [3,7,8,4,9,7,2, 11, 17, 0];
        let addNewArr = 13;
        
        function getSumTarget(arr, target){
            let newMap = new Map();
            let newArr = [];
            arr.forEach(element => {
                let diff = target - element;
                if(newMap.has(diff)){
                    newArr.push([element, diff])
                }

                newMap.set(element, true);
            });
            console.log(newArr);
            return newArr
        }
        getSumTarget(newArr, addNewArr)
