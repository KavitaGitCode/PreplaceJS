    <script>
        function longestWordPrograme(string){
            let splitWords = string.split(' ');
            let largeNumber = splitWords[0];
           for(let i = 0; i < splitWords.length; i++){
                if(splitWords[i].length > largeNumber.length){
                    largeNumber = splitWords[i];
                } 
               /*  console.log(largeNumber)
                       // Incorrect usage: return largeNumber; // This would stop the loop prematurely
                return largeNumber */
            }
            console.log(largeNumber)
                return largeNumber /// Correct usage: return after the loop completes
        }
        longestWordPrograme("I The quick browns fox jumps");


        function findEvenNumber(numbers){
            for(let i = 0; i < numbers.length; i++){
                if(numbers[i] % 2 === 0){
                    return numbers[i]
                }
            }

            return null //return null if no even value is find
        }
        const numbers = [1, 3, 5, 7, 8, 10];
    console.log(findEvenNumber(numbers)); // Output: 8

    function findTarget(arr, target){
        for(let i = 0; i < arr.length; i++){
            for(let j = 0; j < arr[i].length; j++){
                console.log(arr[i][j], j)
               if(arr[i][j] === target){
                //console.log({ row: i, col: j})
                return {row: i, col: j}
               }
            }
        }
    }

    const matrix = [
    [1, 2, 3], 
    [4, 5, 6],
    [7, 8, 9] 
];
console.log(findTarget(matrix, 3)); // Output: { row: 2, col: 0 }


function doubleNumbers(numbers){
    const double = [];
    for(let i = 0; i < numbers.length; i++){
        double.push(numbers[i] * 2)
    }
    return double
}
const numbers2 = [1, 2, 3, 4, 5];
console.log(doubleNumbers(numbers2)); // Output: [2, 4, 6, 8, 10]
