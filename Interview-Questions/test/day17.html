    <script>
        function anagramCheck(word1, word2){
            if(word1.length !== word2.length){
                return false
            }

            let strg1 = word1.replace(/\s+/g, '').toLowerCase().split('').sort().join('');
            let strg2 = word2.replace(/\s+/g, '').toLowerCase().split('').sort().join('');

            return strg1 === strg2
        }

        const check = anagramCheck('modi', 'monu');
        const check2 = anagramCheck('listen', 'silent');
        console.log(check);
        console.log(check2);

        function isPrimeNum(num){
            let isPrime = true;
            if(num === 1) return `1 number is not prime number not composite number`;
            if(num < 1) return 'this is not prime number';
            if(num > 1){
                for(let i = 2; i < num; i++){
                    //The loop runs from 2 to 2 (since 3 - 1 is 2), and checks if 3 is divisible by 2.
                    //Since 3 is not divisible by 2, isPrime remains true.
                    //If num is divisible by any number between 2 and num - 1, it is not prime.

                    if(num % i === 0){
                        isPrime = false;
                        break
                    }
                }
            }
           return isPrime ? true : false
        }
        console.log(isPrimeNum(3));

            let mergeArr = [...arr1, ...arr2];
            return mergeArr.sort();
