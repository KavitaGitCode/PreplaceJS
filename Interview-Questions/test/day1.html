        //Merge Two Sorted Arrays
        function mergeArrays(arr1, arr2){

            mergeArr.sort((a, b) => a - b);

        // Sum of Array Elements
        function sumArray(arr){
            return arr.reduce((acc, currentVal) => acc + currentVal, 0);
        }
        console.log(sumArray([1, 2, 3, 4, 5])); // 15

        // Factorial of a Number
        function factorial(num){
            if(num <= 1) return 1

            if(num > 1){
              return   num * factorial(num - 1) //5*4*3*2*1
            }
        }
        console.log(factorial(5));

        //Capitalize the First Letter of Each Word
        function capitalizeWords(sentence){
            let splitWord = sentence.split(" ");
            let updatedWords = splitWord.map((item) => item.charAt(0).toUpperCase() + item.slice(1).toLowerCase()).join(' ');
            console.log(updatedWords);
            return updatedWords
        }

        console.log(capitalizeWords('hello world of web'));

         function removeDuplicates(arr){

            return [...new Set(arr)]

        //find the large number in Array
        function findLargest(arr){
            return Math.max(...arr)
        }

        console.log(findLargest([1, 2, 3, 4, 5, 1000, 0,])); // 1000

        //. Check for Palindrome

        function isPalindrome(stringTxt){
            let cleanString = stringTxt.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
            console.log(cleanString, cleanString.split('').reverse().join(''));
            return cleanString === cleanString.split('').reverse().join('');
        }

        console.log(isPalindrome('A man, a plan, a canal: Panama')); // true
        console.log(isPalindrome('hello')); // false
