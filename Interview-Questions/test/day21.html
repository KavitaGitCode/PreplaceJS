    <script>
        //Exercise 2: Deep Merge Two Objects
        /* Write a function to deeply merge two objects. If a key exists in both objects,
         the value from the second object should overwrite the value from the first. */
        const obj1 = {
            a: 1,
            b: {
                c: 2,
                d: 3
            }
        };

        const obj2 = {
            b: {
                c: 4,
                e: 5
            },
            f: 6
        };

        /* 
        //result
        {
            a: 1,
            b: {
                c: 4,
                d: 3,
                e: 5
            },
            f: 6
        } */

        let simpleMerge = {
            ...obj2,
            ...obj1
        };
        console.log(simpleMerge);

        function deepMerge(obj1, obj2) {
            let result = {};

            // Merge keys from obj1
            for (let key in obj1) {
                if (obj1.hasOwnProperty(key)) {
                    // If both obj1 and obj2 have this key and it's an object, merge them
                    if (typeof obj1[key] === 'object' && obj2.hasOwnProperty(key) && typeof obj2[key] === 'object' && !
                        Array.isArray(obj1[key]) && !Array.isArray(obj2[key])) {
                        result[key] = deepMerge(obj1[key], obj2[key]);
                    } else {
                        // Otherwise, take the value from obj1
                        result[key] = obj1[key];
                    }
                }
            }

            // Merge keys from obj2
            for (let key in obj2) {
                if (obj2.hasOwnProperty(key)) {
                    // If obj1 has already set this key and both are objects, it has already been merged
                    if (!(key in result)) {
                        result[key] = obj2[key];
                    }
                }
            }

            return result;
        }

        // Perform the deep merge
        const mergedObj = deepMerge(obj1, obj2);

        console.log(mergedObj);
