function formateObj(obj){
    let newObj = {};
    function recursiveFormateObj(prefix, data){
        for(let key in data){
            if(typeof data[key] === 'object' && !Array.isArray(data[key])) {
                recursiveFormateObj(`${prefix}_${key}`, data[key])
            } else {
                newObj[`${prefix}_${key}`] = data[key]
            }
        }
    }
    
    for(let key in obj){
        recursiveFormateObj(key, obj[key])
    }

    return newObj;
}

console.log(formateObj(obj));

/* {

function flattenObj(obj){
    let newObj = {};

    function formateObj(keysObj, objVal){
        if(typeof objVal === 'object' && !Array.isArray(objVal)){
            for(let i in objVal){
                formateObj(`${keysObj}_${i}`, objVal[i]) 
            }
        } else { 
            newObj[`${keysObj}`] =  objVal;
        }
    }

    for(let key in obj){
        console.log(key, obj[key], typeof obj[key], 'i m from outter loop');
        formateObj(key, obj[key]);
    }

    console.log(newObj);
    return newObj;
}

flattenObj(input);
