function compareBy(propertyName){
     return function(a, b){
        let x = a[propertyName];
        let y = b[propertyName];

        if(x > y){
            return 1
        } else if(x < y){
            return -1
        } else {
            return 0;
        }
     }
}

function factorial(num){
            if(isNaN(num)) throw new Error("This is not a number");

            if(num === 1){
                return 1
            } else {
               /*  debugger */
                return num * factorial(num - 1);
             /*    debugger */
            }
        }
      console.log(factorial(5));

      function deepCopy(arr) {
    // Create an empty array to store the copied elements
    let copy = [];
    
    // Iterate through each element of the original array
    for (let i = 0; i < arr.length; i++) {
        // Check if the current element is an array
        if (Array.isArray(arr[i])) {
            // If it's an array, recursively call deepCopy to clone the nested array
            copy[i] = deepCopy(arr[i]);
        } else {
            // If it's not an array, simply copy the element
            console.log(copy[i], 'copy[i]', 'before');
            console.log( arr[i], 'arr[i]',  'before')
            copy[i] = arr[i];

            console.log(copy[i], 'copy[i]');
            console.log( arr[i], 'arr[i]')
        }
    }
    
    // Return the copied array
    return copy;
}
const originalArray = [1, 2, [3, 4]];
// Creating a deep copy
const copiedArray = deepCopy(originalArray);

// Modifying the copied array
copiedArray[0] = 100;
copiedArray[2][0] = 300;

// Output
console.log(originalArray); // Output: [1, 2, [3, 4]]
console.log(copiedArray);   // Output: [100, 2, [300, 4]]

function sameObj(arr){
  let check = {};

  arr.forEach((item) => {
    if(!check[item.age]){
      check[item.age] = [item]
    } else {
      check[item.age].push(item)
    }
  })

  return check;
}

let inputStack = [];
 let outputStack = [];

 //Enqueue...add in arr
 function enQueue(arr, newArr){
    return arr.unshift(newArr)
}

 function deQueue(inputArr, outputArr){
    if(outputArr.length <= 0){
        if(inputArr.length > 0){
            let element = inputArr.pop();
            outputArr.push(element)
        }
    }
    //return outputArr;
    return  outputArr.pop();
}

function getSum(arr, sum){
    let newMap = {};
    let result = [];
    arr.forEach((item, index) => {
        let complement = sum - item;
                          /* 9  - 2 = 7
                          9 - 7 = 2
                          9 - 11 = -2
                          9 - 15 = -6
                          9 - 8 = 1
                          9 - 1 = 8 */
        if(newMap.hasOwnProperty(complement)){
            /* newMap[item] = index;
            console.log(newMap); */
           /*  [[2, 7], [8, 1]] : [0, 1] [4, 5] */
           console.log(newMap[complement]);
            result.push([newMap[complement], index])
        } 
        
        //// Add the current item to the map with its index
        newMap[item] = index;
        /* {2: 0, 7: 1, 11: 2, 15: 3, 8: 4, 1: 5} */
    })

    return result;
}
