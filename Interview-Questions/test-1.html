function isPalindrom(strg) {
    let clearText = strg.map((item) => {
        return item.toLowerCase().replace(/[^a-z0-9)]/g,'')
    });
    let getPalindromText = clearText.map((item) => item.split('').reverse().join(''));
    //2nd solution
   /* let intersection =  clearText.filter(item => getPalindromText.includes(item));
   console.log(intersection, 'intersection');
   return intersection; */
   return arrayDifference(clearText, getPalindromText);
}

 function getPalidromArr(arr){

 let nestedArr =  [[1, 2], [3, 4], [5, 6, [9, 3000]]];
let singelArr = nestedArr.flat(Infinity);
console.log(nestedArr);
console.log(singelArr);

function flatArrFun(arr, level){
  let result = [];
  arr.forEach((item) => {
    if(Array.isArray(item) && level > 0){
      result.push(...flatArrFun(item, level - 1))
    }  else{
      result.push(item);
    }
  })
  return result;
}
console.log(flatArrFun(nestedArr, Infinity));


let arrNew1= [1, 2, 3, 4, 5, 6, 7];

function chunkingArry(arr, size){
  let newArr = [];
  for(let i = 0; i < arr.length; i+=size){
    newArr.push(arr.slice(i, size + i))
  }
  return newArr;
}

console.log(chunkingArry(arrNew1, 3));
