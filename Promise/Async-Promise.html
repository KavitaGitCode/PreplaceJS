<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        async function getFakeApi() {
            /* The fetch() method is used to make a request to the server located at "https://some-api.com/data". The returned value is a promise that will be fulfilled with the server's response. */
            return fetch('https://fakestoreapi.com/products');
        }

        //The first .then() method is called to consume the promise and extract JSON data from the response.  
        getFakeApi().then((response) => {
            return response.json();
        }).then((data) => { //The next then() method is called to log the extracted data to the console.
            console.log(data);
        })

        //another examples
        let promise1 = fetch('https://jsonplaceholder.typicode.com/posts/1');
let promise2 = fetch('https://jsonplaceholder.typicode.com/posts/2');
let promise3 = fetch('https://jsonplaceholder.typicode.com/posts/3');


        Promise.all([promise1, promise2, promise3])
        .then((value) => console.log(value))
        .catch((error) => console.log(error))


        //another examples
        
 async function getData() {
  try{
    const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');

  if (!response.ok) {
    const message = `An error has occured: ${response.status}`;
    throw new Error(message);
  }

  const data = await response.json();
  console.log(data);
  } catch(error){
   console.error(error); 
  }
  
}

getData();

    </script>
</body>

</html>
