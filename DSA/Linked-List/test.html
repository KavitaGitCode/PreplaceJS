  <script>
    class Node {
      constructor(value) {
        this.value = value;
        this.next = null;
      }
    }

    class LinkedList {
      constructor() {
        this.head = null; //head pointer is always point to the first pointer in the list
        this.size = 0;
      }

      isEmpty() {
        return this.size === 0;
      }

      getSize() {
        return this.size;
      }

      //how to add node from start ...unshift(prepend) method
      unshift(value) {
        let node = new Node(value);
        if (this.isEmpty()) {
          //when list is empty
          this.head = node;
        } else {
          //when list is not empty
          node.next = this.head;
          this.head = node;
        }
        this.size++;
      }

      //add node from last...push(append) method
      push(value) {
        let node = new Node(value);
        if (this.isEmpty()) {
          this.head = node;
        } else {
          let prev = this.head;
          while (prev.next) {
            prev = prev.next;
          }
          console.log(prev, "prev");
          prev.next = node;
        }
        this.size++;
      }

      //remove node from last
      pop() {
        //if only one node in the list
        if (this.size === 1) {
          this.head = null;
          this.size--;
        }
        //if there is no node
        if (this.isEmpty()) {
          return null;
        } else {
          /* Why while (prev.next.next)? This condition ensures that you stop one car before the last one. If you have cars A -> B -> C -> null, you want to stop at B (second-to-last). So, prev.next is C and prev.next.next is null, which stops the loop.
    Why prev.next = null? This line disconnects the last car. If prev is B, then prev.next is C, and setting prev.next to null removes C. */
          let prev = this.head;
          while (prev.next.next) {
            prev = prev.next;
          }
          prev.next = null;
        }
        this.size--;
        this.print();
      }

      //addValueFromGivenIndex (insert) value
      addValueFromGivenIndex(value, index) {
        //if invalid index suppose index is greater than the list size
        if (index > this.size || index < 0) {
          return; //this will return function
        }

        //if insert value at 0 position (insert node at the begining of the list)
        if (index === 0) {
          this.unshift(value);
        } else {
          //if index is valid and greater than 0..add value in middle of list
          const node = new Node(value); //new instance of node class
          let prev = this.head; //initialise prev point to head
          for (let i = 0; i < index - 1; i++) {
            //advance prev pointer ..we point prev point at its own next pointer
            //for loop will exit when prev pointer is at previous node
            prev = prev.next;
          }
          //this will ensure the new node connected to existing list
          node.next = prev.next;
          prev.next = node;
          this.size++;
        }
      }

      //remove value from given index
      removeValueFromGivenIndex(index) {
        //1. list empty?
        if (this.isEmpty()) {
          return null;
        }
        //2. Check if the index is valid
        if (index >= this.size || index < 0) {
          console.log("sorry the given index is greater than its size");
          return;
        }
        //3. index is 0
        if (index === 0) {
          //this.head = this.head.next;
          this.size--;
          return;
        }

        //3. how i m gonna reach that index and delete that value
        // 4. Traverse list to find the node just before the one you want to remove

        let prev = this.head;
        for (let i = 0; i < index - 1; i++) {
          prev = prev.next;
        }

        //Update the `next` pointer to skip the node you want to remove
        /* prev.next = prev.next.next; */
        //Decrease the size
        this.size--;
        this.print();
      }

      replaceFromIndex(replaceVal, index) {
        if (this.isEmpty()) {
          return null;
        }

        if (index >= this.size || index < 0) {
          console.log("sorry the given index is greater than its size");
          return;
        }

        let current = this.head;
        /*  for (let i = 0; i < index; i++) {
        current = current.next;
      }
  
      current.value = replaceVal; */
        this.print();
      }

      //slice
      slice(startIndex, endIndex) {
        if (this.isEmpty()) {
          return null;
        }

        if (startIndex >= this.size || startIndex < 0 || endIndex >= this.size || endIndex < 0 || startIndex ===
          endIndex || startIndex > endIndex) {
          return;
        }

        let prev = this.head;
      }

      //how to display list
      print() {
        if (this.isEmpty()) {
          console.log("List is empty");
        } else {
          let curr = this.head;
          let listValues = "";
          while (curr) {
            listValues += `${curr.value} `;
            curr = curr.next;
          }
          console.log(listValues, "----");
          return listValues;
        }
      }
    }
