       function selection1() {
            let arr = [432, 23, 2, 8, 39, 78];

            for (let i = 0; i < arr.length; i++) {
                let min = i; //compare index

                for (let j = i + 1; j < arr.length; j++) {
                    //console.log(arr[i], i);

                    //comparison and swap
                    if (arr[min] > arr[j]) {
                        min = j
                    }
                }
                [arr[min], arr[i]] = [arr[i], arr[min]];
            }

            console.log(arr);

        }

        function selectionSort(arr) {
            for (let i = 0; i < arr.length; i++) {
                let min = i;
                for (let j = i + 1; j < arr.length; j++) {
                    if (arr[j] < arr[min]) {
                        min = j
                    }
                }
                //if(min !== i){
                [arr[min], arr[i]] = [arr[i], arr[min]]
                //}
            }
            console.log(arr, 'sdjhk');
            return arr;
        }

        const arr1 = [64, 25, 12, 22, 11];
        // Display input array 
        console.log("Original array: " + arr1)

        // Sort array using custom selection sort function 
        selectionSort(arr1);

        // Display output 
        console.log("After sorting: " + arr1);
